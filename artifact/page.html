<!-- Artifact wrapper page. Published via the Artifact tool, which supplies the
     doctype/head/body skeleton, so this file starts at <title>. The page is the
     game and nothing else: no copy, no chrome, just the canvas filling the view.
     The game itself is js2/*.js, published alongside it unchanged. -->
<title>Onga Bonga</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000;
    overflow: hidden; color-scheme: dark;
  }
  #stage {
    width: 100vw; height: 100vh;
    display: grid; place-items: center;
    background: #000;
  }
  /* 16:9 letterboxed against whichever axis runs out first. */
  canvas#game {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #0b0710; touch-action: none; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>

<div id="stage">
  <canvas id="game" width="960" height="540" aria-label="Onga Bonga, a playable pixel art game"></canvas>
</div>

<script>
  // The first tap or key press asks for real fullscreen, once. Browsers only
  // grant it from a user gesture, and refusing is fine — the page already fills
  // the viewport either way.
  (function () {
    var asked = false;
    function go() {
      if (asked) return; asked = true;
      var el = document.getElementById('stage');
      var fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!fn) return;
      try { var p = fn.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () { }); }
      catch (e) { }
    }
    window.addEventListener('pointerdown', go, { once: true });
    window.addEventListener('keydown', go, { once: true });
  })();

  // Carry a run across republishes.
  (function () {
    var SAVE = 'ongabonga_v3_save', SETTINGS = 'ongabonga_v2_settings';
    function restore(d) {
      try {
        if (!d) return;
        if (d.save) localStorage.setItem(SAVE, d.save);
        if (d.settings) localStorage.setItem(SETTINGS, d.settings);
      } catch (e) { /* private browsing: play on, just without a saved run */ }
    }
    try {
      var hot = window.claude && window.claude.hot;
      if (hot && hot.ready) hot.ready(restore); else restore(hot && hot.data);
      if (hot && hot.snapshot) hot.snapshot(function () {
        try { return { save: localStorage.getItem(SAVE), settings: localStorage.getItem(SETTINGS) }; }
        catch (e) { return {}; }
      });
    } catch (e) { }
  })();
</script>
